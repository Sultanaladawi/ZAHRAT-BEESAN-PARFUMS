name: Sync supplier prices, stock and offers

on:
  schedule:
    # Hourly: GitHub drops some scheduled runs when busy, so a short interval
    # keeps prices, stock and offers fresh even when a run is skipped.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # sharp resizes the photos of products the import adds.
      - name: Install image library
        run: npm install --no-save --no-audit --no-fund sharp

      # Also adds products the suppliers (Assaf, Laverne) newly list, sold out
      # or not; unsure ones are listed in tools/import-review.json. At most 40
      # new products a run, the daily 03:xx run also reads every category.
      - name: Check suppliers, apply price, stock and offer changes, import new products
        run: node tools/sync-check.js --apply --import

      # Photo galleries change rarely and cost one request per product, so
      # they are refreshed once a day (the 03:xx UTC run) or on a manual run.
      - name: Refresh supplier photo galleries
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" = "03" ]; then
            node tools/galleries.js
          else
            echo "Not the daily gallery run."
          fi

      # Stock changes can swap which copy of a duplicate is shown.
      - name: Hide duplicate products
        run: node tools/dedupe.js

      # Product details checked against the suppliers (sizes, set contents):
      # the sync does not touch them, this just makes sure they stay.
      - name: Keep checked product details
        run: node tools/apply-fixes.js

      # Fees follow lib/fees.js (mini perfumes, small oils, sets): new products
      # and changed sizes get the right fee, finalJod/origJod follow it.
      - name: Keep fees in line with the rules
        run: node tools/recompute-fees.js

      - name: Commit updated catalog
        run: |
          if [ -z "$(git status --porcelain -- public tools/import-review.json)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "catalog-sync-bot"
          git config user.email "catalog-sync-bot@users.noreply.github.com"
          git add public/data public/images tools/import-review.json
          MSG="Sync supplier prices, stock and offers"
          if [ -s tools/last-import.txt ]; then
            MSG="$MSG; new products

$(cat tools/last-import.txt)"
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push
