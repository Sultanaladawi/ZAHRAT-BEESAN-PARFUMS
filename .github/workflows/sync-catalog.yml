name: Sync supplier prices, stock and offers

on:
  schedule:
    # Hourly: GitHub drops some scheduled runs when busy, so a short interval
    # keeps prices, stock and offers fresh even when a run is skipped.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check suppliers and apply price, stock and offer changes
        run: node tools/sync-check.js --apply

      - name: Commit updated catalog
        run: |
          if git diff --quiet -- public/data; then
            echo "No changes."
            exit 0
          fi
          git config user.name "catalog-sync-bot"
          git config user.email "catalog-sync-bot@users.noreply.github.com"
          git add public/data
          git commit -m "Sync supplier prices, stock and offers"
          git pull --rebase origin main
          git push
