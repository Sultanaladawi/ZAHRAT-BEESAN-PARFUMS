      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-al-dakheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-al-dakheel)" stroke="#A3E635" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#A3E635" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-al-dakheel)"/>

  <!-- Official Brand Crest Motif -->
