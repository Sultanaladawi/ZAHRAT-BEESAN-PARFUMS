<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-rasasi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-rasasi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-rasasi)" stroke="#38BDF8" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-rasasi)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Rasasi Majestic Falcon -->
      <path d="M50 26 C44 32 38 42 38 54 C44 52 50 54 50 64 C50 54 56 52 62 54 C62 42 56 32 50 26 Z" fill="#38BDF8"/>
      <circle cx="50" cy="34" r="3" fill="#FFFFFF"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="1">RASASI</text>
</svg>