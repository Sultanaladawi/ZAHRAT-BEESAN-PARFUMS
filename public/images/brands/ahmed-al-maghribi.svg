<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-ahmed-al-maghribi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B0E1E" />
      <stop offset="100%" stop-color="#10030A" />
    </linearGradient>
    <radialGradient id="glow-ahmed-al-maghribi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5B842" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E5B842" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-ahmed-al-maghribi)" stroke="#E5B842" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#E5B842" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-ahmed-al-maghribi)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -3)">
    
      <!-- Moroccan Royal Arch & Trefoil -->
      <path d="M36 62 V48 C36 38 44 32 50 32 C56 32 64 38 64 48 V62" fill="none" stroke="#E5B842" stroke-width="2.5"/>
      <path d="M42 62 V50 C42 44 46 40 50 40 C54 40 58 44 58 50 V62" fill="none" stroke="#FFF0B0" stroke-width="1.8"/>
      <circle cx="50" cy="27" r="3" fill="#E5B842"/>
      <line x1="32" y1="63" x2="68" y2="63" stroke="#E5B842" stroke-width="2.5" stroke-linecap="round"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="6" font-weight="900" fill="#E5B842" text-anchor="middle" letter-spacing="1">AHMED AL MAGHRIBI</text>
</svg>
