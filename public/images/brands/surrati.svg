<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-surrati" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24190E" />
      <stop offset="100%" stop-color="#0C0804" />
    </linearGradient>
    <radialGradient id="glow-surrati" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D9A74A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D9A74A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-surrati)" stroke="#D9A74A" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#D9A74A" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-surrati)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -3)">
    
      <!-- Surrati Historic Makkah 1929 Seal -->
      <circle cx="50" cy="45" r="21" fill="none" stroke="#D9A74A" stroke-width="2"/>
      <circle cx="50" cy="45" r="17" fill="none" stroke="#D9A74A" stroke-width="0.8" stroke-dasharray="2 2"/>
      <path d="M50 28 L54 36 L62 38 L56 44 L58 52 L50 48 L42 52 L44 44 L38 38 L46 36 Z" fill="#D9A74A"/>
      <circle cx="50" cy="42" r="3" fill="#24190E"/>
      <text x="50" y="60" font-family="'Cinzel', serif" font-size="5" font-weight="900" fill="#F9E1A2" text-anchor="middle" letter-spacing="1">EST. 1929</text>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#D9A74A" text-anchor="middle" letter-spacing="1">SURRATI</text>
</svg>
