<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-areeb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131B2E" />
      <stop offset="100%" stop-color="#070A12" />
    </linearGradient>
    <radialGradient id="glow-areeb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CCA43B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#CCA43B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-areeb)" stroke="#CCA43B" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#CCA43B" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-areeb)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -3)">
    
      <!-- Areeb Octagram Star & Monogram -->
      <polygon points="50,26 56,38 68,38 58,46 62,58 50,51 38,58 42,46 32,38 44,38" fill="none" stroke="#CCA43B" stroke-width="2.2"/>
      <circle cx="50" cy="46" r="6" fill="#CCA43B"/>
      <circle cx="50" cy="46" r="2" fill="#F5E296"/>
      <circle cx="50" cy="65" r="2" fill="#CCA43B"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#CCA43B" text-anchor="middle" letter-spacing="1">AREEB</text>
</svg>
