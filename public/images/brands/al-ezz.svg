  <circle cx="50" cy="50" r="44" fill="none" stroke="#D97706" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-al-ezz)"/>

