<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-osma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-osma" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#86EFAC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#86EFAC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-osma)" stroke="#86EFAC" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#86EFAC" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-osma)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Osma Botanical Laurel Branch -->
      <circle cx="50" cy="48" r="18" fill="none" stroke="#86EFAC" stroke-width="2"/>
      <path d="M50 34 C44 42 44 54 50 62 C56 54 56 42 50 34 Z" fill="#86EFAC"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#86EFAC" text-anchor="middle" letter-spacing="1">OSMA</text>
</svg>