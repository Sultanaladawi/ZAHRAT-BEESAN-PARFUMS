<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-gissah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-gissah" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0B568" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E0B568" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-gissah)" stroke="#E0B568" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#E0B568" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-gissah)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -3)">
    
      <!-- Gissah Iconic Minimal Luxury Seal -->
      <polygon points="50,26 68,37 68,59 50,70 32,59 32,37" fill="none" stroke="#E0B568" stroke-width="2"/>
      <polygon points="50,33 62,40 62,55 50,62 38,55 38,40" fill="none" stroke="#E0B568" stroke-width="1" opacity="0.6"/>
      <text x="50" y="53" font-family="'Cinzel', 'Trajan Pro', serif" font-size="16" font-weight="900" fill="#FFF2D1" text-anchor="middle">G</text>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#E0B568" text-anchor="middle" letter-spacing="1">GISSAH</text>
</svg>
