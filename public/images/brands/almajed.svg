<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-almajed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-almajed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-almajed)" stroke="#FBBF24" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#FBBF24" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-almajed)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Almajed Vintage Crest & Year 1956 -->
      <circle cx="50" cy="48" r="24" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-dasharray="2 3"/>
      <path d="M38 52 C42 42 58 42 62 52 C58 60 42 60 38 52 Z" fill="#FBBF24"/>
      <circle cx="50" cy="38" r="4" fill="#FDE68A"/>
      <path d="M46 30 L50 24 L54 30 Z" fill="#FBBF24"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#FBBF24" text-anchor="middle" letter-spacing="1">ALMAJED 4 OUD</text>
</svg>