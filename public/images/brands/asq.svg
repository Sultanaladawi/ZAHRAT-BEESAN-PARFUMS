<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-asq" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-asq" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-asq)" stroke="#D4AF37" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-asq)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- ASQ Royal Seal & Twin Swords Motif -->
      <circle cx="50" cy="48" r="22" fill="none" stroke="#D4AF37" stroke-width="2"/>
      <path d="M40 58 L50 36 L60 58 Z" fill="none" stroke="#FFE5B4" stroke-width="2.5"/>
      <line x1="36" y1="52" x2="64" y2="52" stroke="#D4AF37" stroke-width="2"/>
      <circle cx="50" cy="32" r="3" fill="#D4AF37"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#D4AF37" text-anchor="middle" letter-spacing="1">ASQ</text>
</svg>