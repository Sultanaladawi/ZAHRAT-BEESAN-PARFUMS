<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-oud-elite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-oud-elite" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-oud-elite)" stroke="#A855F7" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#A855F7" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-oud-elite)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Oud Elite Diamond Crest -->
      <path d="M50 24 L70 42 L50 72 L30 42 Z" fill="none" stroke="#A855F7" stroke-width="3"/>
      <path d="M30 42 H70 M50 24 L42 42 L50 72 M50 24 L58 42 L50 72" stroke="#C084FC" stroke-width="1.5"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#A855F7" text-anchor="middle" letter-spacing="1">OUD ELITE</text>
</svg>