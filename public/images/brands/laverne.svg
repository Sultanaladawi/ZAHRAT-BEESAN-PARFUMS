<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-laverne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-laverne" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-laverne)" stroke="#C5A880" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#C5A880" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-laverne)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Laverne Four-Petal Flower Motif -->
      <circle cx="50" cy="40" r="9" fill="#C5A880"/>
      <circle cx="50" cy="56" r="9" fill="#C5A880"/>
      <circle cx="42" cy="48" r="9" fill="#C5A880"/>
      <circle cx="58" cy="48" r="9" fill="#C5A880"/>
      <circle cx="50" cy="48" r="5" fill="#18181B"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#C5A880" text-anchor="middle" letter-spacing="1">LAVERNE</text>
</svg>