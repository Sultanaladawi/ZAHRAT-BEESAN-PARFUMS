<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-zimaya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-zimaya" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-zimaya)" stroke="#93C5FD" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#93C5FD" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-zimaya)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Zimaya Stylized Z -->
      <path d="M34 34 H66 L38 62 H66" fill="none" stroke="#93C5FD" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="62" cy="34" r="3" fill="#FFFFFF"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#93C5FD" text-anchor="middle" letter-spacing="1">ZIMAYA</text>
</svg>