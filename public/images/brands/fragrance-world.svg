<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-fragrance-world" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-fragrance-world" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-fragrance-world)" stroke="#38BDF8" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-fragrance-world)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Globe with Perfume Bottle -->
      <circle cx="50" cy="48" r="20" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
      <ellipse cx="50" cy="48" rx="10" ry="20" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="30" y1="48" x2="70" y2="48" stroke="#38BDF8" stroke-width="1.5"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="1">FRAGRANCE WORLD</text>
</svg>