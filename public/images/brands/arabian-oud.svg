<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-arabian-oud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-arabian-oud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5A880" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C5A880" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-arabian-oud)" stroke="#C5A880" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#C5A880" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-arabian-oud)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Arabian Oud Intertwined Calligraphic A -->
      <path d="M34 64 L46 32 H54 L66 64 H58 L55 56 H45 L42 64 Z M47 50 H53 L50 40 Z" fill="#C5A880"/>
      <circle cx="50" cy="24" r="3" fill="#FFE5B4"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#C5A880" text-anchor="middle" letter-spacing="1">ARABIAN OUD</text>
</svg>