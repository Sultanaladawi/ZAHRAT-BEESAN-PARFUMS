<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-banafa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-banafa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-banafa)" stroke="#F59E0B" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#F59E0B" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-banafa)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Banafa Traditional Emblem -->
      <circle cx="50" cy="48" r="22" fill="none" stroke="#F59E0B" stroke-width="3"/>
      <path d="M42 56 C42 44 58 44 58 56" fill="none" stroke="#FDE68A" stroke-width="3"/>
      <circle cx="50" cy="38" r="4" fill="#F59E0B"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="1">BANAFA</text>
</svg>