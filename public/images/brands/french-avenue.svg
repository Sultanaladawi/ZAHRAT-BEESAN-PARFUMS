<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <clipPath id="clip-french-avenue">
      <circle cx="50" cy="50" r="47"/>
    </clipPath>
  </defs>
  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="#000000" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.75"/>
  <!-- Official Brand Image Logo -->
  <g clip-path="url(#clip-french-avenue)">
    <image href="data:image/png;base64," x="3" y="3" width="94" height="94" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
