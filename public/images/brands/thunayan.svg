<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-thunayan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C1917" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-thunayan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-thunayan)" stroke="#EAB308" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#EAB308" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-thunayan)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Thunayan Royal Monogram T -->
      <path d="M34 36 H66 M50 36 V64" stroke="#EAB308" stroke-width="5" stroke-linecap="round"/>
      <circle cx="34" cy="30" r="2.5" fill="#FEF08A"/>
      <circle cx="66" cy="30" r="2.5" fill="#FEF08A"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#EAB308" text-anchor="middle" letter-spacing="1">THUNAYAN</text>
</svg>