<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-samam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27170E" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-samam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0A96D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E0A96D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-samam)" stroke="#E0A96D" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#E0A96D" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-samam)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Samam Calligraphic Crest -->
      <path d="M34 50 C34 40 46 34 50 42 C54 34 66 40 66 50 C66 62 50 68 50 68 C50 68 34 62 34 50 Z" fill="none" stroke="#E0A96D" stroke-width="3"/>
      <circle cx="50" cy="50" r="5" fill="#E0A96D"/>
      <circle cx="50" cy="30" r="3" fill="#F5D0A9"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#E0A96D" text-anchor="middle" letter-spacing="1">SAMAM</text>
</svg>