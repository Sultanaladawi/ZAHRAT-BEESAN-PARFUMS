<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-ajmal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24101A" />
      <stop offset="100%" stop-color="#0C0509" />
    </linearGradient>
    <radialGradient id="glow-ajmal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0AA3E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E0AA3E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-ajmal)" stroke="#E0AA3E" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#E0AA3E" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-ajmal)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -3)">
    
      <!-- Ajmal 7-Point Starburst & Seal -->
      <polygon points="50,27 54,38 65,34 62,45 73,49 63,55 68,66 57,64 50,73 43,64 32,66 37,55 27,49 38,45 35,34 46,38" fill="none" stroke="#E0AA3E" stroke-width="1.8"/>
      <circle cx="50" cy="50" r="9" fill="#E0AA3E"/>
      <text x="50" y="54" font-family="'Cinzel', serif" font-size="11" font-weight="900" fill="#24101A" text-anchor="middle">A</text>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#E0AA3E" text-anchor="middle" letter-spacing="1">AJMAL</text>
</svg>
