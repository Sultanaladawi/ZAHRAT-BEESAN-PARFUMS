<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-assaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="glow-assaf" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Circular Outer Medallion -->
  <circle cx="50" cy="50" r="48" fill="url(#grad-assaf)" stroke="#D4AF37" stroke-width="1.8"/>
  <circle cx="50" cy="50" r="44" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-dasharray="2 2" opacity="0.7"/>
  <circle cx="50" cy="50" r="38" fill="url(#glow-assaf)"/>

  <!-- Official Brand Crest Motif -->
  <g transform="translate(0, -4)">
    
      <!-- Assaf Royal Crown Motif -->
      <path d="M32 60 L36 40 L46 50 L50 34 L54 50 L64 40 L68 60 Z" fill="#D4AF37"/>
      <circle cx="50" cy="30" r="3" fill="#FFE5B4"/>
      <rect x="32" y="62" width="36" height="4" rx="2" fill="#D4AF37"/>
    
  </g>

  <!-- Typography Brand Mark -->
  <text x="50" y="86" font-family="'Cinzel', 'Trajan Pro', serif, 'Amiri'" font-size="7.5" font-weight="900" fill="#D4AF37" text-anchor="middle" letter-spacing="1">ASSAF</text>
</svg>